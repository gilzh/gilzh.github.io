<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <!-- Immediate redirect -->
  <meta http-equiv="refresh" content="0; url=https://foodplanner-pulj.onrender.com/">

  <!-- Canonical redirect for SEO -->
  <link rel="canonical" href="https://foodplanner-pulj.onrender.com/">

  <script>
    // Fallback redirect (in case meta refresh is ignored)
    window.location.replace("https://foodplanner-pulj.onrender.com/");
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://foodplanner-pulj.onrender.com/">FoodPlanner</a>...</p>
</body>
</html>
