<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <!-- Immediate redirect -->
  <meta http-equiv="refresh" content="0; url=https://www.instagram.com/gilles.2050">

  <!-- Canonical redirect for SEO -->
  <link rel="canonical" href="https://www.instagram.com/gilles.2050">

  <script>
    // Fallback redirect (in case meta refresh is ignored)
    window.location.replace("https://www.instagram.com/gilles.2050");
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://www.instagram.com/gilles.2050">gilles.2050</a>...</p>
</body>
</html>
